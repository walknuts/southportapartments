<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Southport Apartments</title>
    <link rel="icon" href="/southportapartments/favicon.ico" sizes="any" />
    <style>
      @font-face {
        font-family: "Fraunces";
        font-weight: 600;
        font-display: swap;
        src: url("/southportapartments/fraunces-600.woff2") format("woff2");
      }

      body {
        margin: 0;
        font:
          1.1rem/1.6 ui-sans-serif,
          -apple-system,
          "Segoe UI",
          roboto,
          "Helvetica Neue",
          arial,
          sans-serif;
        color: #696670;
        background: #fff;
      }

      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgb(105 102 112 / 15%);
      }

      header img {
        display: block;
        height: 32px;
        width: auto;
      }

      .hero {
        display: block;
        width: 100%;
        max-height: 60vh;
        object-fit: cover;
      }

      main {
        max-width: 70ch;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }

      h1 {
        font-family: "Fraunces", ui-serif, georgia, serif;
        font-weight: 600;
        font-size: clamp(2.25rem, 1.6rem + 3.2vw, 3.6rem);
        line-height: 1.15;
        color: #2f2c38;
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/southportapartments/wordmark.jpg" alt="Southport Apartments" />
    </header>
    <img class="hero" src="/southportapartments/banner.jpg" alt="" />
    <main>
      <h1>Southport Apartments</h1>
      <p>This website is offline until further notice.</p>
    </main>
  </body>
</html>
